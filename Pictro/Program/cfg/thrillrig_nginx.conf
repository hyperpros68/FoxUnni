server {
    listen 9990;
    server_name thrillrig.com 115.21.37.119 _;

    root /home/mika/Project/ThrillRig/Program/TRService/www;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pictro 상용 REST API 역방향 프록시 (FastAPI 포트 49991 연동)
    location /pictro-api/ {
        proxy_pass http://127.0.0.1:49991/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /pictro-api;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        client_max_body_size 50M;
    }

    # /kiosk/shopXX 끝에 슬래시가 없는 경우 슬래시 추가
    rewrite ^/kiosk/([^/]+)$ /kiosk/$1/ permanent;

    # shop01 (터널 포트 15001)
    location /kiosk/shop01/ {
        proxy_pass http://127.0.0.1:15001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # shop02 (터널 포트 15002)
    location /kiosk/shop02/ {
        proxy_pass http://127.0.0.1:15002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # shop03 (터널 포트 15003)
    location /kiosk/shop03/ {
        proxy_pass http://127.0.0.1:15003/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    include /etc/nginx/kiosk-shops/*.conf;
    location /kiosk/ {
        rewrite ^/kiosk/([^/]+)/$ /api/kiosk_redirect.php?shop_code=$1 last;
    }

    location /http-bind {
        proxy_pass http://127.0.0.1:5280/http-bind;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        tcp_nodelay on;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
}
