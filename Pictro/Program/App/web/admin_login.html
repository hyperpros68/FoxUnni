<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pictro - 슈퍼 관리자 보안 콘솔 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(15, 18, 28, 0.92);
      --card-border: rgba(239, 68, 68, 0.2);
      --accent-red: #ef4444;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(8, 10, 16, 0.8);
      --input-border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(239, 68, 68, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(244, 63, 94, 0.08) 0%, transparent 40%);
      font-family: 'Pretendard', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(239, 68, 68, 0.15);
    }
    .logo-area {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #ef4444, #991b1b);
      border-radius: 14px;
      font-size: 22px;
      color: #fff;
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
      margin-bottom: 12px;
    }
    .logo-title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fca5a5;
    }
    .logo-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .security-notice {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      color: #fca5a5;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      height: 44px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 0 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: var(--accent-red);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25);
    }
    .btn-submit {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
      margin-top: 10px;
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(239, 68, 68, 0.45);
    }
    .footer-links {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .footer-links a {
      color: #cbd5e1;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: #fff; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="logo-area">
      <div class="logo-badge">🛡️</div>
      <div class="logo-title">PICTRO SUPER ADMIN</div>
      <div class="logo-subtitle">운영자 전용 플랫폼 통합 관제 시스템</div>
    </div>

    <div class="security-notice">
      <span>🔒</span>
      <span>인가된 관리자 계정만 접근할 수 있는 보안 영역입니다.</span>
    </div>

    <form id="formAdminLogin" onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label class="form-label">관리자 계정 ID</label>
        <input type="text" id="adminId" class="form-input" placeholder="client_foxunni_master" required value="client_foxunni_master">
      </div>
      <div class="form-group">
        <label class="form-label">마스터 보안 비밀번호</label>
        <input type="password" id="adminPassword" class="form-input" placeholder="비밀번호를 입력하세요" required value="admin1234!">
      </div>
      <button type="submit" class="btn-submit" id="btnAdminSubmit">관리자 콘솔 인증</button>
    </form>

    <div class="footer-links">
      <a href="login.html">← 일반 고객사 포털 로그인으로 돌아가기</a>
    </div>
  </div>

  <script>
    const API_BASE = '/pictro-api/api/v1/auth';

    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminId').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const btn = document.getElementById('btnAdminSubmit');
      btn.disabled = true;
      btn.textContent = '보안 토큰 검증 중...';

      try {
        const res = await fetch(`${API_BASE}/admin-login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '관리자 인증에 실패했습니다.');

        localStorage.setItem('pictro_admin_token', data.token);
        localStorage.setItem('pictro_admin_user', JSON.stringify(data.user));
        localStorage.setItem('pictro_api_key', data.api_key);

        alert(`슈퍼 관리자 인증 완료: ${data.user.company_name} (권한: ADMIN)`);
        window.location.href = 'admin_dashboard.html';
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '관리자 콘솔 인증';
      }
    }
  </script>

</body>
</html>
